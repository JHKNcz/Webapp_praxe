# Example snippet for your EXISTING nginx container.
# Replace paths and upstream addresses to match your host setup.
#
# Static files: mount or copy market/frontend to your nginx html root.
# API + WS: proxy to localhost ports exposed by docker compose (9080, 9081).

server {
    listen 443 ssl http2;
    server_name market.example.com;

    # ssl_certificate ...
    # ssl_certificate_key ...

    root /srv/market/frontend;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:9081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
