steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_ARTIFACT_REGISTRY_URL}/${_IMAGE_NAME}:${SHORT_SHA}
      - -f
      - market/ws-gateway/Dockerfile
      - market/ws-gateway

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_ARTIFACT_REGISTRY_URL}/${_IMAGE_NAME}:${SHORT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE="${_ARTIFACT_REGISTRY_URL}/${_IMAGE_NAME}:${SHORT_SHA}"
        ARGS=(
          run deploy "${_SERVICE_NAME}"
          --image "${IMAGE}"
          --region "${_REGION}"
          --platform managed
          --allow-unauthenticated
          --set-env-vars "REDIS_URL=${_REDIS_URL},REDIS_PREFIX=${_REDIS_PREFIX}"
        )

        if [[ -n "${_VPC_CONNECTOR}" ]]; then
          ARGS+=(--vpc-connector "${_VPC_CONNECTOR}" --vpc-egress "${_VPC_EGRESS}")
        fi

        gcloud "${ARGS[@]}"

substitutions:
  _ARTIFACT_REGISTRY_URL: europe-west1-docker.pkg.dev/PROJECT_ID/market
  _IMAGE_NAME: ws-gateway
  _SERVICE_NAME: market-ws-gateway
  _REGION: europe-west1
  _REDIS_URL: redis://10.0.0.3:6379
  _REDIS_PREFIX: market:
  _VPC_CONNECTOR: ''
  _VPC_EGRESS: private-ranges-only

images:
  - ${_ARTIFACT_REGISTRY_URL}/${_IMAGE_NAME}:${SHORT_SHA}
